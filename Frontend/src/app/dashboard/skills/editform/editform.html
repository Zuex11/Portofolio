<div class="admin-block">
  <p class="admin-block__title"># edit skill</p>
  <form class="form" (ngSubmit)="onEditSubmit(editForm)" #editForm="ngForm">
    <div class="form__row">
      <div class="form__group">
        <label class="form__label" for="edit-skill-name-input">Skill name</label>
        <input
          class="form__input"
          type="text"
          id="edit-skill-name-input"
          [ngModel]="skill.name"
          name="name"
          required
          #name="ngModel"
        />
        <p class="msg" *ngIf="name.invalid && name.touched">Skill name is required</p>
      </div>
      <div class="form__group">
        <label class="form__label" for="edit-skill-category-input">Category</label>
        <input
          class="form__input"
          type="text"
          id="edit-skill-category-input"
          placeholder="e.g. Frontend"
          [ngModel]="skill.category"
          name="category"
          required
          #category="ngModel"
        />
        <p class="msg" *ngIf="category.invalid && category.touched">Category is required</p>
      </div>
    </div>
    <div class="form__row">
      <div class="form__group">
        <label class="form__label" for="edit-skill-level-input">Level label</label>
        <input
          class="form__input"
          type="text"
          id="edit-skill-level-input"
          placeholder="e.g. Advanced"
          [ngModel]="skill.level"
          name="level"
          required
          #level = "ngModel"
        />
                <p class="msg" *ngIf="level.invalid && level.touched">Level is required</p>

      </div>
      <div class="form__group">
        <label class="form__label" for="edit-skill-percent-input">Level (0-100)</label>
        <input
          class="form__input"
          type="number"
          id="edit-skill-percent-input"
          min="0"
          max="100"
          [ngModel]="skill.levelNum"
          name="levelNum"
          required
          #levelNum = "ngModel"
        />
                <p class="msg" *ngIf="levelNum.invalid && levelNum.touched">levelNum is required</p>

      </div>
    </div>
    <div class="form__group">
      <button type="submit" class="btn btn--primary">Save changes</button>
      <p class="form__status">{{ editStatus }}</p>
      <button type="button" class="btn btn--ghost btn--small" (click)="cancelled.emit()">
        Cancel
      </button>
    </div>
  </form>
</div>
