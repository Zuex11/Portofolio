<section class="section reveal" id="projects" aria-labelledby="projects-title">
  <div class="section__head">
    <span class="section__eyebrow">selected work</span>
    <h2 class="section__title" id="projects-title">Projects</h2>
  </div>

  <div class="card-grid">
    @for (project of projects; track project._id) {
      <article class="card card--project">
        <h3 class="card__title">{{ project.title }}</h3>
        <p>{{ project.desc }}</p>
        <div class="tag-row">
          <span class="tag">{{ project.tech }}</span>
        </div>
        <div class="card__links">
          <a [href]="project.repoUrl" target="_blank" rel="noopener">
            View code <span class="card__arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </article>
    }
  </div>

  @if (projects.length === 0) {
    <div class="empty-state">No projects added yet.</div>
  }
</section>
