<section class="section reveal" id="skills" aria-labelledby="skills-title">
  <div class="section__head">
    <span class="section__eyebrow">what i work with</span>
    <h2 class="section__title" id="skills-title">Skills</h2>
  </div>
  @for (category of categories; track category) {
    <div class="skill-category">
      <h3 class="skill-category__title"># {{ category }}</h3>
      <div class="card-grid">
        @for (skill of groupedSkills[category]; track skill._id) {
          <article class="skill-item">
            <div class="skill-item__top">
              <span class="skill-item__name">{{ skill.name }}</span>
              <span class="skill-item__level">{{ skill.level }}</span>
            </div>
            <div class="skill-item__bar">
              <div class="skill-item__bar-fill" [style.width.%]="skill.levelNum"></div>
            </div>
          </article>
        }
      </div>
    </div>
  }
</section>
