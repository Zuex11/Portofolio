<main class="page-content">
  <p class="path-label">~/<span>about</span></p>

  <!-- ================= HERO ================= -->
  <section class="hero">
    <img class="hero__avatar" [src]="'http://localhost:3000/files/' + about.photo" alt="Profile photo" />
    <div>
      <h1 class="hero__name">{{ about.name }}</h1>
      <span class="hero__role">{{ about.title }}</span>
      <p class="hero__bio">
        {{ about.bio }}
      </p>
    </div>
  </section>

  <!-- ================= CONTACT ================= -->
  <section class="section" aria-labelledby="contact-title">
    <span class="section__eyebrow">get in touch</span>
    <h2 class="section__title" id="contact-title">Contact me</h2>
    <p class="section__subtitle">
      Have a question or want to work together? Send a message below, or reach out directly.
    </p>

    <div class="contact-grid">
      <div class="contact-info">
        <p class="form__label">Email</p>
        <a class="contact-info__email" [href]="'mailto:' + about.email">{{ about.email }}</a>
        <ul class="contact-info__list">
          <li><a [href]="about.github">GitHub</a></li>
          <li><a [href]="about.linkedIn">LinkedIn</a></li>
        </ul>
      </div>

      <div class="contact-card">
        <form class="form" novalidate (ngSubmit)="sendMessage()">
          <div class="form__row">
            <div class="form__group">
              <label class="form__label form__label--required" for="contact-name">Your name</label>
              <input
                class="form__input"
                type="text"
                id="contact-name"
                name="name"
                required
                autocomplete="name"
                [(ngModel)]="contact.name"
              />
            </div>
            <div class="form__group">
              <label class="form__label form__label--required" for="contact-email-input"
                >Your email</label
              >
              <input
                class="form__input"
                type="email"
                id="contact-email-input"
                name="email"
                required
                autocomplete="email"
                [(ngModel)]="contact.email"
              />
            </div>
          </div>
          <div class="form__group">
            <label class="form__label form__label--required" for="contact-message">Message</label>
            <textarea
              class="form__textarea"
              id="contact-message"
              name="message"
              required
              [(ngModel)]="contact.message"
            ></textarea>
          </div>
          <div class="form__group">
            <button type="submit" class="btn btn--primary">Send message</button>
            <p class="form__status">{{ contactStatus }}</p>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
