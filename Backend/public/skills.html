<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="tab-nav" aria-label="Main navigation">
    <div class="tab-nav__brand">
      <span class="tab-nav__brand-dot" aria-hidden="true"></span>
      portfolio
    </div>
    <div class="tab-nav__tabs">
      <a class="tab-nav__tab" href="index.html">
        <span class="tab-nav__tab-dot" aria-hidden="true"></span>about.html
      </a>
      <a class="tab-nav__tab is-active" href="skills.html">
        <span class="tab-nav__tab-dot" aria-hidden="true"></span>skills.html
      </a>
      <a class="tab-nav__tab" href="education.html">
        <span class="tab-nav__tab-dot" aria-hidden="true"></span>education.html
      </a>
      <a class="tab-nav__tab" href="projects.html">
        <span class="tab-nav__tab-dot" aria-hidden="true"></span>projects.html
      </a>
      <a class="tab-nav__tab" href="admin.html">
        <span class="tab-nav__tab-dot" aria-hidden="true"></span>admin.html
      </a>
    </div>
  </nav>

  <main class="page-content">

    <p class="path-label">~/<span>skills</span></p>

    <section class="section" aria-labelledby="skills-title">
      <span class="section__eyebrow">what i work with</span>
      <h1 class="section__title" id="skills-title">Skills</h1>
      <p class="section__subtitle">Grouped by category. Populated from the database and managed from the admin dashboard.</p>
    </section>

    <!-- Skill categories are rendered here by JS. One .skill-category block per
         category, each containing a .skill-item per skill. A template for a
         single category and a single skill item are provided below for cloning. -->
    <div id="skills-container">
      <!-- Example static category, safe to remove once JS renders real data -->
      <section class="skill-category" data-category="Frontend">
        <h2 class="skill-category__title"># frontend</h2>
        <div class="card-grid">
          <article class="skill-item" data-skill="JavaScript">
            <div class="skill-item__top">
              <span class="skill-item__name">JavaScript</span>
              <span class="skill-item__level" data-field="level">Advanced</span>
            </div>
            <div class="skill-item__bar">
              <div class="skill-item__bar-fill" style="width: 85%;" data-field="level-percent"></div>
            </div>
          </article>
        </div>
      </section>
    </div>

    <div class="empty-state" id="skills-empty" hidden>No skills added yet.</div>

  </main>

  <!-- ===== Templates for JS cloning ===== -->
  <template id="skill-category-template">
    <section class="skill-category" data-category="">
      <h2 class="skill-category__title"></h2>
      <div class="card-grid" data-role="skill-list"></div>
    </section>
  </template>

  <template id="skill-item-template">
    <article class="skill-item" data-skill="">
      <div class="skill-item__top">
        <span class="skill-item__name" data-field="name"></span>
        <span class="skill-item__level" data-field="level"></span>
      </div>
      <div class="skill-item__bar">
        <div class="skill-item__bar-fill" data-field="level-percent"></div>
      </div>
    </article>
  </template>

  <footer class="status-bar">
    <div class="status-bar__group">
      <span id="status-connection">● db: connected</span>
    </div>
    <div class="status-bar__group">
      <a href="admin.html">admin</a>
      <span id="status-year">2026</span>
    </div>
  </footer>

</body>
</html>
